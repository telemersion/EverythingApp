<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EverythingApp</title>
  <link rel="stylesheet" href="ui.css">
  <script src="ui.js" defer></script>
</head>
<body>
  <nav id="list" class="list" aria-label="Documents" hidden>
    <div id="notices" class="notices"></div>
    <div id="entries" class="entries"></div>
    <div id="list-handle" class="list-handle" title="Drag to resize the list"></div>
  </nav>
  <div id="panes"></div>
  <div id="dividers"></div>
  <div id="drop-marker" class="drop-marker" hidden></div>
  <div id="drag-ghost" class="drag-ghost" hidden></div>
  <div id="empty" class="empty" hidden>
    <button id="open" type="button">Open…</button>
    <p>Drop a document here</p>
  </div>
</body>
</html>
