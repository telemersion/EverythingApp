<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="ev-host-api" content="1">
  <meta name="ev-doc-type" content="note" data-version="1.0">
  <meta name="ev-doc-id" content="">
  <title>Note</title>
  <style id="ev-style">
body { font: 15px/1.45 system-ui, sans-serif; margin: 24px; }
textarea { display: block; width: 100%; min-height: 160px; font: inherit; margin-bottom: 12px; }
#status { margin-left: 12px; color: #66767a; }
#status.dirty { color: #a35a00; font-weight: 600; }
</style>
  <script type="application/json" id="ev-manifest">{}</script>
</head>
<body>
  <div id="ev-app"></div>
  <script type="application/json" id="ev-data">{"text":""}</script>
  <script id="ev-kit" data-kit-version="1.9.0">
/* EverythingApp test kit 1.9.0 (host API v1), never published: kit 2.0.0 under an older version, for testing kit updates. Part of the document frame:
   the host checks this exact text by hash. Do not edit it in a document. */
(function () {
  'use strict';

  var KIT_VERSION = '1.9.0';
  var kitText = document.currentScript.textContent;
  var styleText = document.getElementById('ev-style').textContent;
  var docTypeMeta = document.querySelector('meta[name="ev-doc-type"]');
  var frame = {
    lang: document.documentElement.getAttribute('lang'),
    api: document.querySelector('meta[name="ev-host-api"]').getAttribute('content'),
    docType: docTypeMeta.getAttribute('content'),
    docTypeVersion: docTypeMeta.getAttribute('data-version'),
    docId: document.querySelector('meta[name="ev-doc-id"]').getAttribute('content'),
    title: document.querySelector('head > title').textContent
  };
  var manifestText = document.getElementById('ev-manifest').textContent;
  var modules = {};
  var initialized = false;

  function escapeJson(json) {
    return json.replace(/</g, '\\u003c');
  }

  // Must produce exactly the frame of doc-host/src/frame.js.
  function buildDocument(p) {
    return '<!DOCTYPE html>\n<html lang="' + p.lang + '">\n<head>\n' +
      '  <meta charset="utf-8">\n' +
      '  <meta name="ev-host-api" content="' + p.api + '">\n' +
      '  <meta name="ev-doc-type" content="' + p.docType + '" data-version="' + p.docTypeVersion + '">\n' +
      '  <meta name="ev-doc-id" content="' + p.docId + '">\n' +
      '  <title>' + p.title + '</title>\n' +
      '  <style id="ev-style">' + p.style + '</style>\n' +
      '  <script type="application/json" id="ev-manifest">' + p.manifest + '<\/script>\n' +
      '</head>\n<body>\n' +
      '  <div id="ev-app"></div>\n' +
      '  <script type="application/json" id="ev-data">' + p.data + '<\/script>\n' +
      '  <script id="ev-kit" data-kit-version="' + p.kitVersion + '">' + p.kit + '<\/script>\n' +
      p.modules.map(function (m) {
        return '  <script id="ev-module-' + m.name + '" data-module-version="' + m.version + '">' + m.text + '<\/script>\n';
      }).join('') +
      '  <script id="ev-script">' + p.script + '<\/script>\n' +
      '</body>\n</html>\n';
  }

  // The module elements come after the kit, so they are read when needed.
  function moduleParts() {
    var els = document.querySelectorAll('script[id^="ev-module-"]');
    var parts = [];
    for (var i = 0; i < els.length; i++) {
      parts.push({ name: els[i].id.slice('ev-module-'.length), version: els[i].getAttribute('data-module-version'), text: els[i].textContent });
    }
    return parts;
  }

  function randomHex(bytes) {
    var values = crypto.getRandomValues(new Uint8Array(bytes));
    var out = '';
    for (var i = 0; i < values.length; i++) out += (values[i] < 16 ? '0' : '') + values[i].toString(16);
    return out;
  }

  // ---------- Data designed for merging ----------

  function newId() {
    return randomHex(8);
  }

  // Sort keys: strings over DIGITS (in ASCII order) that never end in '0', so
  // there is always room before a key; compared as plain strings.
  var DIGITS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  var SORT_KEY = /^[0-9A-Za-z]*[1-9A-Za-z]$/;

  function midpoint(a, b) { // a < b; a may be '', b may be null (no upper bound)
    if (b !== null) {
      var n = 0;
      while ((a[n] || '0') === b[n]) n++;
      if (n > 0) return b.slice(0, n) + midpoint(a.slice(n), b.slice(n));
    }
    var da = a ? DIGITS.indexOf(a[0]) : 0;
    var db = b !== null ? DIGITS.indexOf(b[0]) : DIGITS.length;
    if (db - da > 1) return DIGITS[Math.round((da + db) / 2)];
    if (b !== null && b.length > 1) return b.slice(0, 1);
    return DIGITS[da] + midpoint(a.slice(1), null);
  }

  function orderBetween(before, after) {
    [before, after].forEach(function (key) {
      if (key !== null && (typeof key !== 'string' || !SORT_KEY.test(key))) {
        throw new Error('EvKit.orderBetween: ' + JSON.stringify(key) + ' is not a sort key (letters and digits, not ending in 0) or null.');
      }
    });
    if (before !== null && after !== null && !(before < after)) {
      throw new Error('EvKit.orderBetween: ' + JSON.stringify(before) + ' must sort before ' + JSON.stringify(after) + '.');
    }
    return midpoint(before || '', after);
  }

  function ordered(map, key) {
    key = key || 'order';
    return Object.keys(map).map(function (id) { return [id, map[id]]; }).sort(function (x, y) {
      var a = x[1] && typeof x[1][key] === 'string' ? x[1][key] : null;
      var b = y[1] && typeof y[1][key] === 'string' ? y[1][key] : null;
      if (a !== b) {
        if (a === null) return 1;
        if (b === null) return -1;
        return a < b ? -1 : 1;
      }
      return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0;
    });
  }

  // ---------- Modules ----------

  function defineModule(name, version, exports) {
    if (Object.prototype.hasOwnProperty.call(modules, name)) {
      throw new Error('EvKit.defineModule: module ' + name + ' is already defined.');
    }
    modules[name] = { version: version, exports: exports };
  }

  function module(name, major) {
    if (!Object.prototype.hasOwnProperty.call(modules, name)) {
      throw new Error('This document has no module ' + name + '. Add it to the document (document specification, section 6).');
    }
    var found = modules[name];
    if (parseInt(found.version, 10) !== major) {
      throw new Error('This document has module ' + name + ' ' + found.version + ', but the script needs major version ' + major + '.');
    }
    return found.exports;
  }

  // ---------- Browser fallback: save a new copy of this file ----------

  var DB_NAME = 'ev-kit-handles';
  var STORE = 'handles';
  var fileHandle = null;

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function loadHandle() {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var q = db.transaction(STORE).objectStore(STORE).get(location.href);
        q.onsuccess = function () { resolve(q.result || null); };
        q.onerror = function () { reject(q.error); };
      });
    }).catch(function () { return null; });
  }

  function storeHandle(handle) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(handle, location.href);
        tx.oncomplete = resolve;
        tx.onerror = function () { reject(tx.error); };
      });
    }).catch(function () { /* not critical: the picker appears again next time */ });
  }

  function suggestedName() {
    var last = decodeURIComponent(location.pathname.split('/').pop() || '');
    return last || frame.docType + '.ev.html';
  }

  async function writeWithPicker(html) {
    if (!fileHandle) fileHandle = await loadHandle();
    if (fileHandle) {
      var perm = await fileHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await fileHandle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') fileHandle = null;
    }
    if (!fileHandle) {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: suggestedName(),
        types: [{ description: 'EverythingApp document', accept: { 'text/html': ['.html'] } }]
      });
      await storeHandle(fileHandle);
    }
    var w = await fileHandle.createWritable();
    await w.write(html);
    await w.close();
  }

  function download(html) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = suggestedName();
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  async function fallbackSave(html) {
    try {
      if (window.showSaveFilePicker) await writeWithPicker(html);
      else download(html);
      return true;
    } catch (err) {
      if (err && err.name === 'AbortError') return false;
      fileHandle = null;
      alert('Saving failed: ' + (err && err.message ? err.message : err));
      return false;
    }
  }

  // ---------- Public interface ----------

  function init(options) {
    if (initialized) throw new Error('EvKit.init() may only be called once.');
    initialized = true;
    options = options || {};

    var scriptEl = document.getElementById('ev-script');
    var scriptText = scriptEl ? scriptEl.textContent : '';
    var data = JSON.parse(document.getElementById('ev-data').textContent || '{}');
    if (data === null || typeof data !== 'object' || Array.isArray(data)) data = {};
    var getData = typeof options.getData === 'function' ? options.getData : function () { return data; };
    var onDirtyChange = typeof options.onDirtyChange === 'function' ? options.onDirtyChange : function () {};
    var host = window.evHost && window.evHost.version >= 1 ? window.evHost : null;
    var dirty = false;

    function serialize() {
      return JSON.stringify(getData());
    }

    function toHtml() {
      return buildDocument({
        lang: frame.lang, api: frame.api, docType: frame.docType,
        docTypeVersion: frame.docTypeVersion, docId: frame.docId, title: frame.title,
        style: styleText, manifest: manifestText, data: escapeJson(serialize()),
        kitVersion: KIT_VERSION, kit: kitText, modules: moduleParts(), script: scriptText
      });
    }

    // Elements the document marks data-ev-fallback="status" show the save state.
    function showFallbackStatus() {
      var els = document.querySelectorAll('[data-ev-fallback="status"]');
      for (var i = 0; i < els.length; i++) {
        els[i].textContent = dirty ? 'Unsaved changes' : 'Saved';
        els[i].setAttribute('data-ev-state', dirty ? 'unsaved' : 'saved');
      }
    }

    function setDirty(value) {
      if (dirty === value) return;
      dirty = value;
      showFallbackStatus();
      onDirtyChange(value);
    }

    function save() {
      if (host) return Promise.resolve(false);
      // A new document gets its id with its first save (document specification, rule 10).
      if (!frame.docId) frame.docId = randomHex(16);
      return fallbackSave(toHtml()).then(function (ok) {
        if (ok) setDirty(false);
        return ok;
      });
    }

    if (host) {
      // The host owns saving, the dirty marker and the close prompt.
      host.onSaveRequest(serialize);
      // Fallback UI the document marks is hidden here; saving rebuilds from the frame.
      var hide = document.createElement('style');
      hide.textContent = '[data-ev-fallback] { display: none !important; }';
      document.head.append(hide);
    } else {
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          save();
        }
      });
      window.addEventListener('beforeunload', function (e) {
        if (dirty) { e.preventDefault(); e.returnValue = ''; }
      });
      document.addEventListener('click', function (e) {
        var target = e.target;
        if (target && target.closest && target.closest('[data-ev-fallback="save"]')) {
          e.preventDefault();
          save();
        }
      });
      document.addEventListener('DOMContentLoaded', showFallbackStatus);
    }

    return Object.freeze({
      data: data,
      hosted: !!host,
      changed: function () {
        if (host) host.markDirty();
        else setDirty(true);
      },
      save: save,
      toHtml: toHtml
    });
  }

  Object.defineProperty(window, 'EvKit', {
    value: Object.freeze({
      version: KIT_VERSION, init: init, newId: newId, orderBetween: orderBetween, ordered: ordered,
      module: module, defineModule: defineModule
    }),
    writable: false,
    configurable: false
  });
})();
</script>
  <script id="ev-script">
// Note written for kit 1.0.0: decides from doc.hosted whether to show its own Save UI.
// Data shape: {"text":""}
(function () {
  'use strict';

  const doc = EvKit.init({ onDirtyChange: (dirty) => showStatus(dirty) });
  const data = doc.data;
  data.text = typeof data.text === 'string' ? data.text : '';

  const app = document.getElementById('ev-app');
  app.innerHTML = `
    <main>
      <textarea id="text" aria-label="Note"></textarea>
      ${doc.hosted ? '' : '<button id="save" type="button">Save</button><span id="status">Saved</span>'}
    </main>
  `;

  const $ = (id) => document.getElementById(id);
  $('text').value = data.text;
  $('text').addEventListener('input', () => {
    data.text = $('text').value;
    doc.changed();
  });

  function showStatus(dirty) {
    const s = $('status');
    if (!s) return;
    s.textContent = dirty ? 'Unsaved changes' : 'Saved';
    s.classList.toggle('dirty', dirty);
  }

  if (!doc.hosted) $('save').addEventListener('click', () => doc.save());
})();
</script>
</body>
</html>
