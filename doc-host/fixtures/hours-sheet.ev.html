<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="ev-host-api" content="1">
  <meta name="ev-doc-type" content="hours-sheet" data-version="1.0">
  <meta name="ev-doc-id" content="">
  <title>Hours sheet</title>
  <style id="ev-style">
:root {
  --paper: #f6f7f3;
  --card: #ffffff;
  --ink: #1d2a2c;
  --muted: #66767a;
  --rule: #d8ddd6;
  --accent: #0f5c63;
  --accent-ink: #ffffff;
  --warn: #a35a00;
  --danger: #a3262a;
  --focus: #1b8a94;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121819;
    --card: #1a2123;
    --ink: #e4ebe9;
    --muted: #8d9fa3;
    --rule: #2d3a3d;
    --accent: #4fb3bd;
    --accent-ink: #0c1a1c;
    --warn: #e0a252;
    --danger: #e5787b;
    --focus: #4fb3bd;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: 28px 20px 80px;
}
main { max-width: 1040px; margin: 0 auto; }

header {
  display: flex; flex-wrap: wrap; align-items: baseline;
  justify-content: space-between; gap: 12px 24px; margin-bottom: 18px;
}
h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
#status { color: var(--muted); font-size: 13px; }
[data-ev-state="unsaved"] { color: var(--warn); font-weight: 600; }

.bar {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end;
  margin-bottom: 14px;
}
.bar label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.bar .spacer { flex: 1; }

button, select, input {
  font: inherit; color: inherit;
}
select, input[type="month"] {
  background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
  padding: 6px 8px; min-height: 34px;
}
button {
  background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
  padding: 6px 14px; min-height: 34px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  font-weight: 600;
}
button.primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.sheet {
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px;
  overflow-x: auto;
}
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th {
  text-align: left; font-weight: 600; font-size: 13px; color: var(--muted);
  padding: 10px 10px; border-bottom: 2px solid var(--rule); white-space: nowrap;
}
td { padding: 0; border-bottom: 1px solid var(--rule); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
td input {
  width: 100%; border: 0; background: transparent; padding: 9px 10px;
  border-radius: 0; min-height: 40px;
}
td input:focus { outline: 2px solid var(--focus); outline-offset: -2px; background: var(--card); }
th.num, td.num input { text-align: right; font-variant-numeric: tabular-nums; }
.c-date { width: 140px; }
.c-person { width: 150px; }
.c-task { width: 24%; }
.c-hours { width: 90px; }
.c-del { width: 44px; }
td.del { text-align: center; }
td.del button {
  border: 0; background: transparent; color: var(--muted); padding: 4px 10px; font-size: 18px;
  line-height: 1; min-height: 0;
}
td.del button:hover { color: var(--danger); }

tfoot td {
  padding: 11px 10px; border-top: 2px solid var(--rule); border-bottom: 0;
  font-weight: 650;
}
tfoot td.num { text-align: right; font-variant-numeric: tabular-nums; }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

#people { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 16px; font-size: 14px; }
#people span { color: var(--muted); }
#people b { color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 4px; }

.hint { margin-top: 28px; color: var(--muted); font-size: 13px; max-width: 70ch; }
kbd {
  border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; font: inherit; font-size: 12px;
}
</style>
  <script type="application/json" id="ev-manifest">{"textFields":["rows.*.note"]}</script>
</head>
<body>

  <script id="ev-kit" data-kit-version="2.0.0">
/* EverythingApp kit 2.0.0 (host API v1). Part of the document frame:

(function () {

  var KIT_VERSION = '2.0.0';
  var kitText = document.currentScript.textContent;
  var styleText = document.getElementById('ev-style').textContent;
  var docTypeMeta = document.querySelector('meta[name="ev-doc-type"]');
  var frame = {
    lang: document.documentElement.getAttribute('lang'),
    api: document.querySelector('meta[name="ev-host-api"]').getAttribute('content'),
    docType: docTypeMeta.getAttribute('content'),
    docTypeVersion: docTypeMeta.getAttribute('data-version'),
    docId: document.querySelector('meta[name="ev-doc-id"]').getAttribute('content'),
    title: document.querySelector('head > title').textContent
  };
  var manifestText = document.getElementById('ev-manifest').textContent;
  var modules = {};
  var initialized = false;

  function escapeJson(json) {
    return json.replace(/</g, '\\u003c');
  }

  // Must produce exactly the frame of doc-host/src/frame.js.
  function buildDocument(p) {
    return '<!DOCTYPE html>\n<html lang="' + p.lang + '">\n<head>\n' +
      '  <meta charset="utf-8">\n' +
      '  <meta name="ev-host-api" content="' + p.api + '">\n' +
      '  <meta name="ev-doc-type" content="' + p.docType + '" data-version="' + p.docTypeVersion + '">\n' +
      '  <meta name="ev-doc-id" content="' + p.docId + '">\n' +
      '  <title>' + p.title + '</title>\n' +
      '  <style id="ev-style">' + p.style + '</style>\n' +
      '  <script type="application/json" id="ev-manifest">' + p.manifest + '<\/script>\n' +
      '</head>\n<body>\n' +
      '  <div id="ev-app"></div>\n' +
      '  <script type="application/json" id="ev-data">' + p.data + '<\/script>\n' +
      '  <script id="ev-kit" data-kit-version="' + p.kitVersion + '">' + p.kit + '<\/script>\n' +
      p.modules.map(function (m) {
        return '  <script id="ev-module-' + m.name + '" data-module-version="' + m.version + '">' + m.text + '<\/script>\n';
      }).join('') +
      '  <script id="ev-script">' + p.script + '<\/script>\n' +
      '</body>\n</html>\n';
  }

  // The module elements come after the kit: init() reads them, before the
  // script can change the page.
  function moduleParts() {
    var els = document.querySelectorAll('script[id^="ev-module-"]');
    var parts = [];
    for (var i = 0; i < els.length; i++) {
      parts.push({ name: els[i].id.slice('ev-module-'.length), version: els[i].getAttribute('data-module-version'), text: els[i].textContent });
    }
    return parts;
  }

  function randomHex(bytes) {
    var values = crypto.getRandomValues(new Uint8Array(bytes));
    var out = '';
    for (var i = 0; i < values.length; i++) out += (values[i] < 16 ? '0' : '') + values[i].toString(16);
    return out;
  }

  // ---------- Data designed for merging ----------

  function newId() {
    return randomHex(8);
  }

  // Sort keys: strings over DIGITS (in ASCII order) that never end in '0', so
  // there is always room before a key; compared as plain strings.
  var DIGITS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  var SORT_KEY = /^[0-9A-Za-z]*[1-9A-Za-z]$/;

  function midpoint(a, b) { // a < b; a may be '', b may be null (no upper bound)
    if (b !== null) {
      var n = 0;
      while ((a[n] || '0') === b[n]) n++;
      if (n > 0) return b.slice(0, n) + midpoint(a.slice(n), b.slice(n));
    }
    var da = a ? DIGITS.indexOf(a[0]) : 0;
    var db = b !== null ? DIGITS.indexOf(b[0]) : DIGITS.length;
    if (db - da > 1) return DIGITS[Math.round((da + db) / 2)];
    if (b !== null && b.length > 1) return b.slice(0, 1);
    return DIGITS[da] + midpoint(a.slice(1), null);
  }

  function orderBetween(before, after) {
    [before, after].forEach(function (key) {
      if (key !== null && (typeof key !== 'string' || !SORT_KEY.test(key))) {
        throw new Error('EvKit.orderBetween: ' + JSON.stringify(key) + ' is not a sort key (letters and digits, not ending in 0) or null.');
      }
    });
    if (before !== null && after !== null && !(before < after)) {
      throw new Error('EvKit.orderBetween: ' + JSON.stringify(before) + ' must sort before ' + JSON.stringify(after) + '.');
    }
    return midpoint(before || '', after);
  }

  function ordered(map, key) {
    key = key || 'order';
    return Object.keys(map).map(function (id) { return [id, map[id]]; }).sort(function (x, y) {
      var a = x[1] && typeof x[1][key] === 'string' ? x[1][key] : null;
      var b = y[1] && typeof y[1][key] === 'string' ? y[1][key] : null;
      if (a !== b) {
        if (a === null) return 1;
        if (b === null) return -1;
        return a < b ? -1 : 1;
      }
      return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0;
    });
  }

  // ---------- Modules ----------

  function defineModule(name, version, exports) {
    if (Object.prototype.hasOwnProperty.call(modules, name)) {
      throw new Error('EvKit.defineModule: module ' + name + ' is already defined.');
    }
    modules[name] = { version: version, exports: exports };
  }

  function module(name, major) {
    if (!Object.prototype.hasOwnProperty.call(modules, name)) {
      throw new Error('This document has no module ' + name + '. Add it to the document (document specification, section 6).');
    }
    var found = modules[name];
    if (parseInt(found.version, 10) !== major) {
      throw new Error('This document has module ' + name + ' ' + found.version + ', but the script needs major version ' + major + '.');
    }
    return found.exports;
  }

  // ---------- Browser fallback: save a new copy of this file ----------

  var DB_NAME = 'ev-kit-handles';
  var STORE = 'handles';
  var fileHandle = null;

  function openDb() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }

  function loadHandle() {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var q = db.transaction(STORE).objectStore(STORE).get(location.href);
        q.onsuccess = function () { resolve(q.result || null); };
        q.onerror = function () { reject(q.error); };
      });
    }).catch(function () { return null; });
  }

  function storeHandle(handle) {
    return openDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(handle, location.href);
        tx.oncomplete = resolve;
        tx.onerror = function () { reject(tx.error); };
      });
    }).catch(function () { /* not critical: the picker appears again next time */ });
  }

  function suggestedName() {
    var last = decodeURIComponent(location.pathname.split('/').pop() || '');
    return last || frame.docType + '.ev.html';
  }

  async function writeWithPicker(html) {
    if (!fileHandle) fileHandle = await loadHandle();
    if (fileHandle) {
      var perm = await fileHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await fileHandle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') fileHandle = null;
    }
    if (!fileHandle) {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: suggestedName(),
        types: [{ description: 'EverythingApp document', accept: { 'text/html': ['.html'] } }]
      });
      await storeHandle(fileHandle);
    }
    var w = await fileHandle.createWritable();
    await w.write(html);
    await w.close();
  }

  function download(html) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = suggestedName();
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  async function fallbackSave(html) {
    try {
      if (window.showSaveFilePicker) await writeWithPicker(html);
      else download(html);
      return true;
    } catch (err) {
      if (err && err.name === 'AbortError') return false;
      fileHandle = null;
      alert('Saving failed: ' + (err && err.message ? err.message : err));
      return false;
    }
  }

  // ---------- Public interface ----------

  function init(options) {
    if (initialized) throw new Error('EvKit.init() may only be called once.');
    initialized = true;
    options = options || {};

    var scriptEl = document.getElementById('ev-script');
    var scriptText = scriptEl ? scriptEl.textContent : '';
    var modulesInFile = moduleParts();
    var data = JSON.parse(document.getElementById('ev-data').textContent || '{}');
    if (data === null || typeof data !== 'object' || Array.isArray(data)) data = {};
    var getData = typeof options.getData === 'function' ? options.getData : function () { return data; };
    var onDirtyChange = typeof options.onDirtyChange === 'function' ? options.onDirtyChange : function () {};
    var host = window.evHost && window.evHost.version >= 1 ? window.evHost : null;
    var dirty = false;

    function serialize() {
      return JSON.stringify(getData());
    }

    function toHtml() {
      return buildDocument({
        lang: frame.lang, api: frame.api, docType: frame.docType,
        docTypeVersion: frame.docTypeVersion, docId: frame.docId, title: frame.title,
        style: styleText, manifest: manifestText, data: escapeJson(serialize()),
        kitVersion: KIT_VERSION, kit: kitText, modules: modulesInFile, script: scriptText
      });
    }

    // Elements the document marks data-ev-fallback="status" show the save state.
    function showFallbackStatus() {
      var els = document.querySelectorAll('[data-ev-fallback="status"]');
      for (var i = 0; i < els.length; i++) {
        els[i].textContent = dirty ? 'Unsaved changes' : 'Saved';
        els[i].setAttribute('data-ev-state', dirty ? 'unsaved' : 'saved');
      }
    }

    function setDirty(value) {
      if (dirty === value) return;
      dirty = value;
      showFallbackStatus();
      onDirtyChange(value);
    }

    function save() {
      if (host) return Promise.resolve(false);
      // A new document gets its id with its first save (document specification, rule 10).
      if (!frame.docId) frame.docId = randomHex(16);
      return fallbackSave(toHtml()).then(function (ok) {
        if (ok) setDirty(false);
        return ok;
      });
    }

    if (host) {
      // The host owns saving, the dirty marker and the close prompt.
      host.onSaveRequest(serialize);
      // Fallback UI the document marks is hidden here; saving rebuilds from the frame.
      var hide = document.createElement('style');
      hide.textContent = '[data-ev-fallback] { display: none !important; }';
      document.head.append(hide);
    } else {
      window.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          save();
        }
      });
      window.addEventListener('beforeunload', function (e) {
        if (dirty) { e.preventDefault(); e.returnValue = ''; }
      });
      document.addEventListener('click', function (e) {
        var target = e.target;
        if (target && target.closest && target.closest('[data-ev-fallback="save"]')) {
          e.preventDefault();
          save();
        }
      });
      document.addEventListener('DOMContentLoaded', showFallbackStatus);
    }

    return Object.freeze({
      data: data,
      hosted: !!host,
      changed: function () {
        if (host) host.markDirty();
        else setDirty(true);
      },
      save: save,
      toHtml: toHtml
    });
  }

  Object.defineProperty(window, 'EvKit', {
    value: Object.freeze({
      version: KIT_VERSION, init: init, newId: newId, orderBetween: orderBetween, ordered: ordered,
      module: module, defineModule: defineModule
    }),
    writable: false,
    configurable: false
  });
})();

  <script id="ev-script">
// Hours sheet: one row per work session.
// Data shape: {"rows":{"<id>":{"date":"YYYY-MM-DD","person":"","task":"","hours":0,"note":""}}}
// Rows live under ids from EvKit.newId(). The order on screen is a view (by
// date when the sheet opens or "Sort by date" is pressed) and is not stored.
(function () {
  'use strict';

  const doc = EvKit.init();
  const data = doc.data;
  const isMap = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  data.rows = isMap(data.rows) ? data.rows : {};
  let view = []; // [id, row] pairs in the order shown

  const todayStr = () => {
    const d = new Date();
    return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  };

  // ---------- Build the UI (only exists at runtime, never saved) ----------
  // The Save button and status are marked data-ev-fallback: the kit hides them in the host
  // and wires them in a browser.
  const app = document.getElementById('ev-app');
  app.innerHTML = `
    <main>
      <header>
        <h1>Hours sheet</h1>
        <span id="status" data-ev-fallback="status">Saved</span>
      </header>

      <div class="bar">
        <button id="add" class="primary">Add row</button>
        <label>Person
          <select id="fPerson"><option value="">All</option></select>
        </label>
        <label>Month
          <input type="month" id="fMonth">
        </label>
        <button id="clearFilter" title="Show all rows">Clear filter</button>
        <span class="spacer"></span>
        <button id="sort">Sort by date</button>
        <button id="save" class="primary" data-ev-fallback="save">Save</button>
      </div>

      <div class="sheet">
        <table>
          <thead>
            <tr>
              <th class="c-date">Date</th>
              <th class="c-person">Person</th>
              <th class="c-task">Task</th>
              <th class="c-hours num">Hours</th>
              <th>Note</th>
              <th class="c-del"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
          <tfoot>
            <tr>
              <td colspan="3">Total</td>
              <td class="num" id="total">0</td>
              <td colspan="2" id="count" style="font-weight:400;color:var(--muted)"></td>
            </tr>
          </tfoot>
        </table>
        <div class="empty" id="empty" hidden>No entries yet. Use “Add row” to log the first work session.</div>
      </div>

      <div id="people"></div>

      <p class="hint">
        ${doc.hosted
          ? 'Save with <kbd>Ctrl</kbd>+<kbd>S</kbd> (or <kbd>Cmd</kbd>+<kbd>S</kbd>) or File → Save.'
          : 'Save with <kbd>Ctrl</kbd>+<kbd>S</kbd> (or <kbd>Cmd</kbd>+<kbd>S</kbd>). In Chrome and Edge, pick this file once ' +
            'and it is remembered; later saves overwrite it. In other browsers a new copy of this page is downloaded; ' +
            'replace the old file with it.'}
      </p>
    </main>
    <datalist id="persons"></datalist>
    <datalist id="tasks"></datalist>
  `;

  const $ = (id) => document.getElementById(id);
  const tbody = $('rows');

  // ---------- Helpers ----------
  const fmt = (n) => (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });

  function unique(field) {
    return [...new Set(Object.values(data.rows).map(r => (r[field] || '').trim()).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b));
  }

  function fillDatalist(id, values) {
    const dl = $(id);
    dl.innerHTML = '';
    values.forEach(v => { const o = document.createElement('option'); o.value = v; dl.append(o); });
  }

  function refreshLists() {
    const persons = unique('person');
    fillDatalist('persons', persons);
    fillDatalist('tasks', unique('task'));
    const sel = $('fPerson');
    const current = sel.value;
    sel.innerHTML = '<option value="">All</option>';
    persons.forEach(p => { const o = document.createElement('option'); o.value = p; o.textContent = p; sel.append(o); });
    sel.value = persons.includes(current) ? current : '';
  }

  function isVisible(r) {
    const p = $('fPerson').value, m = $('fMonth').value;
    if (p && (r.person || '').trim() !== p) return false;
    if (m && !(r.date || '').startsWith(m)) return false;
    return true;
  }

  function applyFilterAndTotals() {
    let total = 0, shown = 0;
    const byPerson = new Map();
    const trs = tbody.children;
    for (let i = 0; i < trs.length; i++) {
      const r = view[i][1];
      const vis = isVisible(r);
      trs[i].hidden = !vis;
      if (vis) {
        shown++;
        const h = Number(r.hours) || 0;
        total += h;
        const key = (r.person || '').trim() || '(no person)';
        byPerson.set(key, (byPerson.get(key) || 0) + h);
      }
    }
    $('total').textContent = fmt(total);
    $('count').textContent = shown + (shown === 1 ? ' entry' : ' entries');
    $('empty').hidden = view.length > 0;

    const box = $('people');
    box.innerHTML = '';
    [...byPerson.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([name, h]) => {
      const s = document.createElement('span');
      s.textContent = name;
      const b = document.createElement('b');
      b.textContent = fmt(h) + ' h';
      s.append(b);
      box.append(s);
    });
  }

  // ---------- Rows ----------
  function cell(cls, input) {
    const td = document.createElement('td');
    if (cls) td.className = cls;
    td.append(input);
    return td;
  }

  function field(row, key, type, extra = {}) {
    const i = document.createElement('input');
    i.type = type;
    i.setAttribute('aria-label', key);
    Object.entries(extra).forEach(([k, v]) => i.setAttribute(k, v));
    i.value = key === 'hours' ? (row.hours || '') : (row[key] || '');
    i.addEventListener('input', () => {
      row[key] = key === 'hours' ? (parseFloat(i.value.replace(',', '.')) || 0) : i.value;
      doc.changed();
      applyFilterAndTotals();
    });
    if (key === 'person' || key === 'task') i.addEventListener('change', refreshLists);
    return i;
  }

  function makeRow(id, row) {
    const tr = document.createElement('tr');
    tr.append(
      cell('', field(row, 'date', 'date')),
      cell('', field(row, 'person', 'text', { list: 'persons', autocomplete: 'off' })),
      cell('', field(row, 'task', 'text', { list: 'tasks', autocomplete: 'off' })),
      cell('num', field(row, 'hours', 'text', { inputmode: 'decimal', placeholder: '0' })),
      cell('', field(row, 'note', 'text'))
    );
    const del = document.createElement('td');
    del.className = 'del';
    const b = document.createElement('button');
    b.textContent = '×';
    b.title = 'Delete row';
    b.setAttribute('aria-label', 'Delete row');
    b.addEventListener('click', () => {
      const idx = view.findIndex(([vid]) => vid === id);
      if (idx < 0) return;
      view.splice(idx, 1);
      delete data.rows[id];
      tr.remove();
      doc.changed();
      refreshLists();
      applyFilterAndTotals();
    });
    del.append(b);
    tr.append(del);
    return tr;
  }

  // Sorting is a view: it changes what is shown, never the data.
  function byDate() {
    return Object.entries(data.rows)
      .sort((a, b) => (a[1].date || '').localeCompare(b[1].date || '') || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  }

  function renderAll() {
    view = byDate();
    tbody.innerHTML = '';
    view.forEach(([id, r]) => tbody.append(makeRow(id, r)));
    refreshLists();
    applyFilterAndTotals();
  }

  $('add').addEventListener('click', () => {
    const last = view.length ? view[view.length - 1][1] : null;
    const row = {
      date: $('fMonth').value ? ($('fMonth').value + '-01') : todayStr(),
      person: $('fPerson').value || (last ? last.person : '') || '',
      task: '', hours: 0, note: ''
    };
    if ($('fMonth').value && todayStr().startsWith($('fMonth').value)) row.date = todayStr();
    const id = EvKit.newId();
    data.rows[id] = row;
    view.push([id, row]);
    const tr = makeRow(id, row);
    tbody.append(tr);
    doc.changed();
    applyFilterAndTotals();
    const target = row.person ? tr.querySelector('td:nth-child(3) input') : tr.querySelector('td:nth-child(2) input');
    target.focus();
  });

  $('sort').addEventListener('click', renderAll);

  $('fPerson').addEventListener('change', applyFilterAndTotals);
  $('fMonth').addEventListener('input', applyFilterAndTotals);
  $('clearFilter').addEventListener('click', () => {
    $('fPerson').value = ''; $('fMonth').value = '';
    applyFilterAndTotals();
  });

  renderAll();
})();
</script>
</body>
</html>
